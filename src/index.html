    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #app-bootstrap-loader {
        --bootstrap-intro-ms: 1500ms;
        --bootstrap-exit-ms: 400ms;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100dvh;
        font-family: "Poppins", sans-serif;
        font-weight: bold;
        background-color: #fff;
        opacity: 1;
        visibility: visible;
        transition:
          opacity var(--bootstrap-exit-ms) ease,
          visibility var(--bootstrap-exit-ms) ease;
      }

      #app-bootstrap-loader.is-exiting {
        opacity: 0;
        visibility: hidden;
      }

      #app-bootstrap-loader svg path {
        fill: transparent;
        stroke: #292524;
        stroke-width: 2px;
        stroke-dasharray: 470;
        stroke-dashoffset: 470;
        animation: TextAnimation var(--bootstrap-intro-ms) ease-in-out 1
          forwards;
      }
      @keyframes TextAnimation {
        0% {
          stroke-dashoffset: 470;
        }

        80% {
          fill: transparent;
        }

        100% {
          fill: #292524;
          stroke-dashoffset: 0;
        }
      }

      #app-bootstrap-loader svg {
        display: block;
        max-width: min(92vw, 766px);
        height: auto;
        animation: Scale var(--bootstrap-intro-ms) linear forwards;
      }

      @keyframes Scale {
        0% {
          transform: scale(0.8);
        }

        80% {
          transform: scale(1.2);
        }

        100% {
          transform: scale(1);
        }
      }

      .bootstrap-loader-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        color: #292524;
        font-size: 14px;
        font-weight: 600;
      }

      .bootstrap-loader-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #dee2e6;
        border-top-color: #292524;
        border-radius: 50%;
        animation: bootstrap-loader-spin 0.75s linear infinite;
      }

      @keyframes bootstrap-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media screen and (max-width: 690px) {
        svg {
          max-width: 72vw !important;
        }
      }
    </style>
