<div class="sidenav">
    <ul>
        <app-nav-button-active background="#fff" color="#24355A" icon="bi-house" text="Sklad" (clicked)="onShowUnits()"
            [isActive]="!warehouseItemsVisible()" />

        <app-nav-button-static background="#24355A" color="#fff" icon="bi-calendar" [text]="calendarText()"
            (clicked)="toggleCalendar()" [isDisabled]="!unitsActive()" />
        <div class="proposal-calendar">
            <p-datepicker #calendar name="deadline" [(ngModel)]="defaultDate" view="month" dateFormat="mm-yy"
                [readonlyInput]="true" [maxDate]="user().role === 'Master' ? maxDate : null"
                (onSelect)="onSelectMonth()" />
        </div>

        @if (user().role === 'Admin') {
        <app-nav-button-active background="#fff" color="#24355A" icon="bi-house" text="F-M"
            (clicked)="onSelectDestination('F-M')" [isActive]="destination() === 'F-M'" [isDisabled]="!unitsActive()" />

        <app-nav-button-active background="#fff" color="#24355A" icon="bi-house" text="OVA"
            [isActive]="destination() === 'OVA'" (clicked)="onSelectDestination('OVA')" [isDisabled]="!unitsActive()" />
        }


        <app-nav-button-active background="#fff" color="#24355A" hide icon="bi-list-ul" text="Položky"
            (clicked)="onShowItems()" [isActive]="warehouseItemsVisible()" />

        <app-nav-button-static background="#05C46B" color="#fff" icon="bi-floppy" text="Uložit"
            [isDisabled]="reorderedItems().length === 0" (clicked)="onSave()" />
