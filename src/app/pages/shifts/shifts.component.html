<div class="sidenav position-fixed h-100">
    @let hideForMaster = authStore.user()?.role !== 'Admin';

    <app-navigation animate.enter="fade-in" animate.leave="fade-out" #nav>
        <app-nav-button [hidden]="hideForMaster" (click)="shiftsStore.addShift()" icon="bi-plus" class="save" />
        <app-nav-button [hidden]="!hideForMaster" (click)="!shiftsStore.isPastCard() && shiftsStore.addShift()"
            [disabled]="shiftsStore.isPastCard() === true" icon="bi-plus" class="save" />
        <app-nav-button (click)="onToggleCalendar($event)" icon="bi-calendar" #toggleBtn />

        <app-nav-button (click)="shiftsStore.uniqueUsers().length > 0 && openModal()" icon="bi-people"
            [disabled]="shiftsStore.uniqueUsers().length === 0" />
        <app-nav-button (click)="shiftsStore.getCards()" icon="bi-arrow-clockwise" />
        <app-nav-button (click)="changeDestination('F-M')" label="F-M" [hidden]="hideForMaster"
            [inactive]="shiftsStore.destination() !== 'F-M'" />
        <app-nav-button (click)="changeDestination('OVA')" label="OVA" [hidden]="hideForMaster"
            [inactive]="shiftsStore.destination() !== 'OVA'" />
        <app-nav-button [hidden]="hideForMaster" (click)="shiftsStore.allToPdf()" icon="bi-filetype-pdf"
            [disabled]="shiftsStore.pdfCards().length === 0" [loading]="shiftsStore.isPdfLoading()" />
    </app-navigation>
</div>

<div class="shifts-calendar position-absolute">
    <p-datepicker #calendar name="deadline" [(ngModel)]="shiftsStore.defaultDate" view="month" dateFormat="mm-yy"
        [readonlyInput]="true" [maxDate]="shiftsStore.maxDate()" (onSelect)="onSelectMonth()"
        (onClickOutside)="onCalendarClickOutside($event, nav.toggleBtn.nativeElement)" />
</div>

<div class="box w-100 d-flex flex-row justify-content-center align-items-center position-relative"
    animate.enter="fade-in" animate.leave="fade-out">
    @if(!shiftsStore.isLoading()) {

    @if (shiftsStore.uniqueUsers().length > 0) {
    <div class="shift-card d-flex flex-column justify-content-center align-items-center" animate.enter="fade-in">
        <swiper-container #swiperRef effect="cards" grab-cursor="false" (swiperinit)="onSwiperInit()"
            (swiperslidechange)="onSlideChange($event)">
            @for(user of shiftsStore.uniqueUsers(); track $index) {
            <swiper-slide>
                <app-shift-card />
            </swiper-slide>
            }
        </swiper-container>
    </div>
    <app-paging>
        <app-prev-next-button icon="bi-caret-left" [disabled]="shiftsStore.sliceIndex() === 0"
            (click)="movePrevious()" />
        <app-prev-next-button icon="bi-caret-right"
            [disabled]="shiftsStore.sliceIndex() === shiftsStore.uniqueUsers().length - 1" (click)="moveNext()" />
    </app-paging>
    } @else {
    <h4 class="fw-bold text-center">{{ shiftsStore.missingCardsMessage() }}</h4>
    }
    } @else {
    <app-shift-skeleton />
    }
</div>
