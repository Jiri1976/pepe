<div class="wrapper">
  <div class="container main">
    <div class="row">
      <div class="col-md-6 side-image position-relative"></div>
      <div
        class="col-md-6 right d-flex justify-content-center align-items-center position-relative"
      >
        <div class="input-box">
          <div class="login-heading">
            <span class="brand-mark"><img src="/pizza.ico" alt="" /></span>
            <span class="eyebrow">PEPE · SPRÁVA SMĚN</span>
            <h1>Přihlášení</h1>
            <p>Přihlaste se ke svému účtu a pokračujte.</p>
          </div>
          <form class="d-flex flex-column align-items-center" (submit)="$event.preventDefault(); onSubmit()">
            <app-field class="login" [displayErrors]="false">
              <i class="bi bi-envelope"></i>
              <input
                type="text"
                class="input"
                id="email"
                placeholder="Email"
                autocomplete="off"
                [formField]="form.email"
                (keydown.enter)="onSubmit()"
              />
            </app-field>
            <app-field [displayErrors]="false" class="login mt-4">
              <i class="bi bi-lock"></i>
              <input
                type="password"
                class="input"
                id="pass"
                placeholder="Heslo"
                autocomplete="off"
                [formField]="form.password"
                (keydown.enter)="onSubmit()"
              />
            </app-field>
            <button
              type="submit"
              class="submit mt-4"
              [class.loading]="store.isLoading()"
              [disabled]="form().invalid() || store.isLoading()"
            >
              @if (!store.isLoading()) {
                Přihlásit se
              } @else {
                <span
                  class="spinner-border spinner-border-sm text-white me-1"
                  aria-hidden="true"
                ></span>
                Přihlašuji se ...
              }
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
