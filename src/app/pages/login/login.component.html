<div class="wrapper">
    <div class="container main">
        <div class="row">
            <div class="col-md-6 side-image">
            </div>
            <div class="col-md-6 right">
                <div class="input-box">
                    <form>
                        <div class="input-field">
                            <i class="bi bi-envelope"></i>
                            <input type="text" class="input" id="email" autocomplete="off" [field]="form.email"
                                (keydown.enter)="onSubmit()">
                        </div>
                        <div class="input-field second">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="input" id="pass" [field]="form.password"
                                (keydown.enter)="onSubmit()">
                        </div>
                        @if (!store.isLoading()) {
                        <button type="button" class="submit" (click)="onSubmit()"
                            [disabled]="form().invalid()">Přihlásit
                            se</button>
                        } @else {
                        <button class="submit loading" type="button" disabled>
                            <span class="spinner-border spinner-border-sm text-white me-1" aria-hidden="true"></span>
                            Přihlašuji se ...
                        </button>
                        }
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
