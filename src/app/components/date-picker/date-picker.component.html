<p-datepicker #datePicker [(ngModel)]="date" dateFormat="dd.mm.yy" [minDate]="minDate()" [maxDate]="maxDate()"
    [readonlyInput]="true" [showIcon]="false" [showOnFocus]="false" [touchUI]="touchUi()" inputStyleClass="shift-date-input" [panelStyleClass]="panelStyleClass()" [panelStyle]="{ width: '320px', maxWidth: 'calc(100vw - 24px)' }" (onFocus)="onInputFocus()" (onBlur)="onInputBlur()" (onShow)="onPanelShow()" (onHide)="onPanelHide()"
    (ngModelChange)="onChange($event)" />
