<div class="menu">
    <ul>
        <li class="main">
            <a (click)="createUser()">
                <i class="bi bi-person-add"></i>
            </a>
        </li>
        <li class="main" (click)="store.getUsers()">
            <a>
                @if (!store.isLoading()) {
                <i class="bi bi-arrow-clockwise"></i>
                } @else {
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                }
            </a>
        </li>

        @let filter = store.filter;
        @let role = store.role;

        <li [class]="filter() === 'F-M' ? 'main' : 'disabled'">
            <a (click)="store.setFilter('F-M')">
                <p>F-M</p>
            </a>
        </li>
        <li [class]="filter() === 'OVA' ? 'main' : 'disabled'">
            <a (click)="store.setFilter('OVA')">
                <p>OVA</p>
            </a>
        </li>
        <li [class]="role() === 'User' ? 'main' : 'disabled'">
            <a (click)="store.setRole('User')">
                <p>U</p>
            </a>
        </li>
        <li [class]="role() === 'Master' ? 'main' : 'disabled'">
            <a (click)="store.setRole('Master')">
                <p>M</p>
            </a>
        </li>
        <li [class]="role() === 'Admin' ? 'main' : 'disabled'">
            <a (click)="store.setRole('Admin')">
                <p>A</p>
            </a>
        </li>
        <li [class]="filter() === 'All' && role() === '' ? 'main' : 'disabled'">
            <a (click)="store.setFilter('All')">
                <p>VŠE</p>
            </a>
        </li>
    </ul>
</div>
