<div class="menu">
    <ul>
        <li class="main">
            <a (click)="createUser()">
                <i class="bi bi-person-add"></i>
            </a>
        </li>
        <li class="main" (click)="usersComponent.getUsers()">
            <a>
                @if (!usersComponent.isLoading()) {
                <i class="bi bi-arrow-clockwise"></i>
                } @else {
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                }
            </a>
        </li>

        <li [class]="filter() === 'F-M' ? 'main' : 'disabled'">
            <a (click)="selectList(1)">
                <p>F-M</p>
            </a>
        </li>
        <li [class]="filter() === 'OVA' ? 'main' : 'disabled'">
            <a (click)="selectList(2)">
                <p>OVA</p>
            </a>
        </li>
        <li
            [class]="role() === 'User' && (selectedList() === 3 || selectedList() === 1 || selectedList() === 2) ? 'main' : 'disabled'">
            <a (click)="selectList(3)">
                <p>U</p>
            </a>
        </li>
        <li
            [class]="role() === 'Master' && (selectedList() === 4 || selectedList() === 1 || selectedList() === 2) ? 'main' : 'disabled'">
            <a (click)="selectList(4)">
                <p>M</p>
            </a>
        </li>
        <li
            [class]="role() === 'Admin' && (selectedList() === 5 || selectedList() === 1 || selectedList() === 2) ? 'main' : 'disabled'">
            <a (click)="selectList(5)">
                <p>A</p>
            </a>
        </li>
        <li [class]="filter() === 'All' ? 'main' : 'disabled'">
            <a (click)="selectList(6)">
                <p>VŠE</p>
            </a>
        </li>
    </ul>
</div>
