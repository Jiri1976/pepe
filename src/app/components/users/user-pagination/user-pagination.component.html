<div class="row">
    @if (users().length > 0) {
    <nav>
        <ul class="pagination">
            <li class="page-item">
                <a class="page-link left" [class.hasPreviousPage]="hasPreviousPage()"
                    [class.disabled]="!hasPreviousPage()" (click)="setPage(currentPage() - 1)" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            @for(p of lastPage(); track $index) {
            <li class="page-item"><a class="page-link" [class.currentPage]="currentPage() === ($index + 1)"
                    (click)="setPage($index + 1)">{{$index + 1}}</a>
            </li>
            }

            <li class="page-item">
                <a class="page-link right" [class.hasNextPage]="hasNextPage()" [class.disabled]="!hasNextPage()"
                    (click)="setPage(currentPage() + 1)" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
    }
</div>
