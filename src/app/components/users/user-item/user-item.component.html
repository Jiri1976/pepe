<div class="row line mt-1" (click)="editUser()" [class]="!user().isActive ? 'disabled' : 'active'">
    <div [class]="`col-4 ${user().isActive}`">{{ user().name }}</div>
    <div [class]="`col-5 ${user().isActive}`">{{ user().surname }}</div>
    <div [class]="`col-3 role ${user().role} ${user().isActive}`">{{
        user().role.substring(0,1) }}
    </div>
</div>
