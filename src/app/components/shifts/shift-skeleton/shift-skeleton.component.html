<div class="skeleton-card" aria-hidden="true">
  <div class="skeleton-table-scroll">
    <table class="skeleton-table">
      <colgroup>
        <col class="col-index" />
        <col class="col-date" />
        <col class="col-time" />
        <col class="col-time" />
        <col class="col-hours" />
        <col class="col-perso" />
      </colgroup>
      <thead>
        <tr>
          @for (column of [1, 2, 3, 4, 5, 6]; track column) {
            <th><span class="skeleton-bar"></span></th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of empty; track $index) {
          <tr>
            @for (column of [1, 2, 3, 4, 5, 6]; track column) {
              <td><span class="skeleton-bar"></span></td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
