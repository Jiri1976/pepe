<div class="menu">
    <ul>
        <li hide class="save" [class.disabled]="shiftsComponent.uniqueUsers().length === 0">
            <a (click)="shiftsComponent.onAddShift()">
                <i class="bi bi-plus"></i>
            </a>
        </li>

        <li hide>
            <a (click)="shiftsComponent.toggleCalendar()">
                <i class="bi bi-calendar"></i>
            </a>
        </li>

        <li hide [class.disabled]="shiftsComponent.uniqueUsers().length === 0">
            <a (click)="openModal()">
                <i class="bi bi-people"></i>
            </a>
        </li>

        <li hide>
            <a (click)="shiftsComponent.onReset()">
                <i class="bi bi-arrow-clockwise"></i>
            </a>
        </li>

        <li hide [class.inactive]="shiftsStore.destination() !== 'F-M'">
            <a (click)="shiftsComponent.onSelectDestination('F-M')">
                <p>F-M</p>
            </a>
        </li>

        <li hide [class.inactive]="shiftsStore.destination() !== 'OVA'">
            <a (click)="shiftsComponent.onSelectDestination('OVA')">
                <p>OVA</p>
            </a>
        </li>

        <li hide [class.disabled]="pdfCards().length === 0">
            <a (click)="shiftsComponent.onAllToPdf()">
                @if (!pdfOn()) {
                <i class="bi bi-filetype-pdf"></i>
                } @else {
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                }
            </a>
        </li>

        <li hideAdmin [class.disabled]="(shiftsComponent.isPastCard() === true)">
            <a (click)="shiftsComponent.onAddShift()">
                <i class="bi bi-plus"></i>
            </a>
        </li>

        <li hideAdmin>
            <a (click)="shiftsComponent.toggleCalendar()">
                <i class="bi bi-calendar"></i>
            </a>
        </li>

        <li hideAdmin [class.disabled]="shiftsComponent.uniqueUsers().length === 0">
            <a (click)="openModal()">
                <i class="bi bi-people"></i>
            </a>
        </li>

        <li hideAdmin>
            <a (click)="shiftsComponent.onReset()">
                <i class="bi bi-arrow-clockwise"></i>
            </a>
        </li>
    </ul>
</div>
