<div class="menu">
    <ul>
        <li hide (click)="shiftsComponent.onAddShift()" [class.disabled]="shiftsComponent.cards().length === 0">
            <a [style.--background]="'#864912'" [style.--color]="'#fff'">
                <i class="bi bi-plus"></i>
            </a>
        </li>

        <li hide class="first" (click)="shiftsComponent.toggleCalendar()">
            <a [style.--background]="'#864912'" [style.--color]="'#fff'">
                <i class="bi bi-calendar"></i>
            </a>
        </li>

        <li hide (click)="openModal()" [class.disabled]="shiftsComponent.cards().length === 0">
            <a [style.--background]="'#864912'" [style.--color]="'#fff'">
                <i class="bi bi-people"></i>
            </a>
        </li>

        <li hide (click)="shiftsComponent.onReset()">
            <a [style.--background]="'#864912'" [style.--color]="'#fff'">
                <i class="bi bi-arrow-clockwise"></i>
            </a>
        </li>

        <li hide (click)="shiftsComponent.onSelectDestination('F-M')">
            <a [style.--background]="destination() === 'F-M' ? '#864912' : '#f7d3af'" [style.--color]="'#fff'">
                <p>F-M</p>
            </a>
        </li>

        <li hide (click)="shiftsComponent.onSelectDestination('OVA')">
            <a [style.--background]="destination() === 'OVA' ? '#864912' : '#f7d3af'" [style.--color]="'#fff'">
                <p>OVA</p>
            </a>
        </li>

        <li hide (click)="shiftsComponent.onAllToPdf()" [class.disabled]="shiftsComponent.cards().length === 0">
            <a [style.--background]="'#864912'" [style.--color]="'#fff'">
                @if (!pdfOn()) {
                <i class="bi bi-filetype-pdf"></i>
                } @else {
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                }
            </a>
        </li>

        <li hideAdmin (click)="shiftsComponent.onAddShift()"
            [class.disabled]="(shiftsComponent.isPastCard() === true && loggedUser.role === 'Master')">
            <a [style.--background]="'#864912'" [style.--color]="'#fff'">
                <i class="bi bi-plus"></i>
            </a>
        </li>

        <li hideAdmin class="first" (click)="shiftsComponent.toggleCalendar()">
            <a [style.--background]="'#864912'" [style.--color]="'#fff'">
                <i class="bi bi-calendar"></i>
            </a>
        </li>

        <li hideAdmin (click)="openModal()" [class.disabled]="shiftsComponent.cards().length === 0">
            <a [style.--background]="'#864912'" [style.--color]="'#fff'">
                <i class="bi bi-people"></i>
            </a>
        </li>

        <li hideAdmin (click)="shiftsComponent.onReset()">
            <a [style.--background]="'#864912'" [style.--color]="'#fff'">
                <i class="bi bi-arrow-clockwise"></i>
            </a>
        </li>
    </ul>
</div>
