<div class="menu">
    <ul>
        <li hide (click)="shiftsComponent.onAddShift()" [class.disabled]="disabled()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-plus"></i>
            </a>
        </li>

        <li hide class="first" (click)="shiftsComponent.toggleCalendar()" [class.disabled]="disabled()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-calendar"></i>
                <p>{{ calendarText() }}</p>
            </a>
        </li>

        <li hide (click)="openModal()" [class.disabled]="disabled()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-people"></i>
            </a>
        </li>

        <li hide (click)="shiftsComponent.onReset()" [class.disabled]="disabled()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-arrow-clockwise"></i>
            </a>
        </li>

        <li hide (click)="shiftsComponent.onSelectDestination('F-M')" [class.disabled]="disabled()">
            <a [style.--background]="destination() === 'F-M' ? '#24355A' : '#0EA5E9'" [style.--color]="'#fff'">
                <p>F-M</p>
            </a>
        </li>

        <li hide (click)="shiftsComponent.onSelectDestination('OVA')" [class.disabled]="disabled()">
            <a [style.--background]="destination() === 'OVA' ? '#24355A' : '#0EA5E9'" [style.--color]="'#fff'">
                <p>OVA</p>
            </a>
        </li>

        <li hide (click)="shiftsComponent.onAllToPdf()" [class.disabled]="disabled()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                @if (!pdfOn()) {
                <i class="bi bi-filetype-pdf"></i>
                } @else {
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                }
            </a>
        </li>

        <li hideAdmin (click)="shiftsComponent.onAddShift()"
            [class.disabled]="(shiftsComponent.isPastCard() === true && loggedUser.role === 'Master') || disabled()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-plus"></i>
            </a>
        </li>

        <li hideAdmin class="first" (click)="shiftsComponent.toggleCalendar()" [class.disabled]="disabled()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-calendar"></i>
                <p>{{ calendarText() }}</p>
            </a>
        </li>

        <li hideAdmin (click)="openModal()" [class.disabled]="disabled()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-people"></i>
            </a>
        </li>

        <li hideAdmin (click)="shiftsComponent.onReset()" [class.disabled]="disabled()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-arrow-clockwise"></i>
            </a>
        </li>
    </ul>
</div>
