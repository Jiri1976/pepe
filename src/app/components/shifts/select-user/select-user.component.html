<section class="select-user" [style]="sectionStyles()" aria-labelledby="select-user-title">
  @let uniqueUsers = store.uniqueUsers();

  <header class="dialog-header">
    <div class="header-icon" aria-hidden="true">
      <i class="bi bi-people"></i>
    </div>
    <div class="heading-copy">
      <span class="eyebrow">Přehled směn</span>
      <h2 id="select-user-title">Vybrat pracovníka</h2>
    </div>
  </header>

  <div #scrollContainer class="users-list" role="list" aria-label="Pracovníci">
    @for (user of uniqueUsers; track user.userId) {
      <button
        class="user"
        type="button"
        role="listitem"
        (click)="onSelectUser(user.userId)"
      >
        <span class="user-avatar" aria-hidden="true">
          {{ user.userName.charAt(0) }}{{ user.userSurname.charAt(0) }}
        </span>
        <span class="user-name">{{ user.userName }} {{ user.userSurname }}</span>
        <i class="bi bi-arrow-right-short select-icon" aria-hidden="true"></i>
      </button>
    }
  </div>

  <footer class="close">
    <button class="closeBtn" type="button" (click)="onClose()">
      <i class="bi bi-x-lg" aria-hidden="true"></i> Zavřít
    </button>
  </footer>
</section>
