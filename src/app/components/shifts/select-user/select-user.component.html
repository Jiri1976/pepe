<div class="select-user" [style]="sectionStyles()">
    @for(user of uniqueUsers(); track user.userId) {
    <div class="user" (click)="onSelectUser(user.userId)">
        <p>{{ user.userName }} {{ user.userSurname }}</p>
    </div>
    }
    <div class="close">
        <button class="closeBtn" (click)="onClose()">Zavřít</button>
    </div>
</div>
