<div class="container">
    <h4 class="mt-2">POTVRZENÍ</h4>
    <i class="bi bi-question-circle"></i>
    <div class="message mt-2">
        {{ confirmation.text() }}
    </div>
    <div class="buttons">
        <button class="cancel" (click)="confirmation.close()" type="button"><i
                class="bi bi-x-circle"></i>&nbsp;Ne</button>
        <button class="confirm" (click)="this.confirmed.emit()" type="button"><i
                class="bi bi-check-circle"></i>&nbsp;Ano</button>
    </div>
</div>
