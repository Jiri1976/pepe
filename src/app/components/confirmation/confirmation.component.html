<section class="confirmation-card" role="alertdialog" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
  <div class="confirmation-icon" aria-hidden="true">
    <i class="bi bi-question-lg"></i>
  </div>

  <div class="confirmation-content">
    <span class="eyebrow">Potvrzení akce</span>
    <h2 id="confirmation-title">Opravdu pokračovat?</h2>
    <p id="confirmation-message">{{ data.text }}</p>
  </div>

  <div class="buttons">
    <button class="cancel" (click)="closeModal(false)" type="button">
      <i class="bi bi-x-lg" aria-hidden="true"></i> Ne, zrušit
    </button>
    <button class="confirm" (click)="closeModal(true)" type="button">
      <i class="bi bi-check-lg" aria-hidden="true"></i> Ano, pokračovat
    </button>
  </div>
</section>
