<div class="container" cdkDropListGroup>
    @if (!isLoading()) {
    <div class="block" animate.enter="fade-in">
        @if (items().length > 0) {
        <div #dashboard class="widget-wrapper">
            @for(item of items(); track $index) {
            <div>
                <app-widget [item]="item" [index]="$index" [(selected)]="selected" cdkDropList
                    (cdkDropListDropped)="drop($event)" [cdkDropListData]="item.position" [(isDragged)]="isDragged" />
            </div>
            }
            <div cdkDropList></div>
        </div>
        }
    </div>

    @if (items().length === 0 && !isDroppedToDelete()) {
    <div class="empty-item" animate.enter="fade-in">
        <h4>Žádné uložené položky.</h4>
    </div>
    }

    } @else {
    <div class="skeleton" animate.enter="fade-out">
        @for(i of [1,2,3,4,5,6,7,8]; track i) {
        <div class="empty-widget">
        </div>
        }
    </div>
    }
</div>
