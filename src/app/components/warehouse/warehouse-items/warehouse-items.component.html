<div class="container">
    @if (!store.isLoading()) {
    <div class="block" animate.enter="fade-in" [style]="bodyStyles()">
        @if (items()!.length > 0) {
        <div class="widget-wrapper" cdkDropList [cdkDropListData]="items()" (cdkDropListDropped)="drop($event)">
            @for(item of items(); track item.id) {
            <div cdkDrag>
                <app-widget [item]="item" [index]="$index" />
            </div>
            }
        </div>
        }
    </div>

    @if (items().length === 0) {
    <div class="empty-item" animate.enter="fade-in">
        <h4>Žádné uložené položky.</h4>
    </div>
    }

    } @else {
    <div class="skeleton" animate.enter="fade-out">
        @for(i of [1,2,3,4,5,6,7,8]; track i) {
        <div class="empty-widget">
        </div>
        }
    </div>
    }
</div>
