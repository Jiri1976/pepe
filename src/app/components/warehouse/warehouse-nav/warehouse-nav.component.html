@let nav = store.warehouseNav();
@if (nav === 'units' || nav === 'board') {
<div class="menu" animate.enter="fade-in" animate.leave="fade-out">
    <ul>
        <li animate.enter="fade-in" animate.leave="fade-out">
            <a (click)="store.getWarehouseCards()">
                <i class="bi bi-arrow-clockwise"></i>
            </a>
        </li>

        <li #toggleBtn hide animate.enter="fade-in" animate.leave="fade-out">
            <a (click)="onToggleCalendar($event)">
                <i class="bi bi-calendar"></i>
            </a>
        </li>

        <li hide animate.enter="fade-in" animate.leave="fade-out" [class.inactive]="store.destination() !== 'F-M'">
            <a (click)="store.setDestination('F-M')">
                <p>F-M</p>
            </a>
        </li>

        <li hide animate.enter="fade-in" animate.leave="fade-out" [class.inactive]="store.destination() !== 'OVA'">
            <a (click)="store.setDestination('OVA')">
                <p>OVA</p>
            </a>
        </li>

        <li hide animate.enter="fade-in" animate.leave="fade-out" [class.disabled]="!store.somethingForDeleting()">
            <a (click)="store.createPdf()">
                @if (!store.isPdfLoading()) {
                <i class="bi bi-filetype-pdf"></i>
                } @else {
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                }
            </a>
        </li>

        <li hide animate.enter="fade-in" animate.leave="fade-out" class="delete"
            [class.disabled]="!store.somethingForDeleting()">
            <a (click)="store.requestDeleteCards()">
                @if (!store.isDeleting()) {
                <i class="bi bi-trash"></i>
                } @else {
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                }
            </a>
        </li>

        @if (nav !== 'board') {
        <li hide [class.disabled]="store.unitItems().length === 0">
            <a (click)="onShowList()">
                <i class="bi bi-list-check"></i>
            </a>
        </li>

        <li hideAdmin>
            <a (click)="onShowList()">
                <i class="bi bi-list-ul"></i>
            </a>
        </li>
        }

        <li [class.inactive]="nav !== 'units'">
            <a (click)="onShowUnits()">
                <i class="bi bi-table"></i>
            </a>
        </li>

        <li hide class="inactive">
            <a (click)="onShowItems()">
                <i class="bi bi-list-ul"></i>
            </a>
        </li>

        <li [class.inactive]="nav !== 'board'">
            <a (click)="onShowBoard()">
                <i class="bi bi-house"></i>
            </a>
        </li>
    </ul>
</div>
}

@if (nav === 'items') {
<div class="menu" animate.enter="fade-in" animate.leave="fade-out">
    <ul>
        <li animate.enter="fade-in" animate.leave="fade-out">
            <a (click)="store.getWarehouseItems()">
                <i class="bi bi-arrow-clockwise"></i>
            </a>
        </li>

        <li animate.enter="fade-in" animate.leave="fade-out" class="add-item"
            [class.disabled]="store.isSomeUnsavedItems()">
            <a (click)="store.addNewItem()">
                <i class="bi bi-plus"></i>
            </a>
        </li>

        <li hide [class.inactive]="nav === 'items'">
            <a (click)="onShowUnits()">
                <i class="bi bi-table"></i>
            </a>
        </li>

        <li hide>
            <a>
                <i class="bi bi-list-ul"></i>
            </a>
        </li>

        <li [class.inactive]="nav === 'items'">
            <a (click)="onShowBoard()">
                <i class="bi bi-house"></i>
            </a>
        </li>
    </ul>
</div>
}
