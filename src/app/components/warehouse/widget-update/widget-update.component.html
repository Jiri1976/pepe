<div class="container">
    @if (!isLoading()) {
    <form [formGroup]="itemForm">
        <div>
            <input type="text" class="form-control" #input
                [class.shake]="itemForm.get('name')?.touched &&itemForm.get('name')?.hasError('required') ||itemForm.get('name')?.untouched &&itemForm.get('name')?.dirty &&itemForm.get('name')?.hasError('required') ||itemForm.get('name')?.hasError('maxlength')"
                id="name" [value]="itemForm.get('name')?.value" formControlName="name">
            <div class="error"
                [style.display]="(itemForm.get('name')?.touched &&itemForm.get('name')?.hasError('required') ||itemForm.get('name')?.untouched &&itemForm.get('name')?.dirty &&itemForm.get('name')?.hasError('required')) ? 'block' : 'none'">
                * Název je povinný údaj</div>
            <div class="error" [style.display]="itemForm.get('name')?.hasError('maxlength') ? 'block' : 'none'">
                * Prosím pouze 30 znaků</div>
        </div>
    </form>

    @if ((itemForm.invalid && itemForm.touched) || (itemForm.dirty && itemForm.invalid)) {
    <div class="notify">
        <app-notification [notify]="(itemForm.invalid && itemForm.touched) || (itemForm.dirty && itemForm.invalid)"
            [height]="'20px'" [width]="'20px'" [ringSize]="'1rem'" />
    </div>
    } @else {
    <button class="save-button" (click)="onSave()"><i class="bi bi-check-lg"></i></button>
    }
    <button class="close-button" (click)="onClose()"><i class="bi bi-x-lg"></i></button>



    } @else {
    <div class="spinner">
        <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    }
</div>
