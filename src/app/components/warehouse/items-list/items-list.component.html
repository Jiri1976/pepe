<p-dialog class="select-item" [modal]="true" [visible]="visible()" [style]="{ width: '25rem' }">
    @for(item of items(); track item.id) {
    <div class="item" (click)="onSelectItem(item.id)">
        <p>{{ item.name }}</p>
    </div>
    }
    <div class="close">
        <button class="closeBtn" (click)="onSelectItem(-1)">Zavřít</button>
    </div>
</p-dialog>
