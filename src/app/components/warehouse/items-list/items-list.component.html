<section class="items-dialog" aria-labelledby="items-dialog-title">
  <header class="dialog-header">
    <div class="header-icon" aria-hidden="true">
      <i class="bi bi-box-seam"></i>
    </div>
    <div class="heading-copy">
      <span class="eyebrow">Sklad</span>
      <h2 id="items-dialog-title">Vybrat položku</h2>
      <p>{{ items().length }} položek v seznamu</p>
    </div>
  </header>

  @if (items().length > 0) {
    <div class="items-list" role="list" aria-label="Skladové položky">
      @for (item of items(); track item.id; let i = $index) {
        <button
          class="item-option"
          type="button"
          role="listitem"
          (click)="onSelectItem(i)"
        >
          <span class="item-icon" aria-hidden="true">
            <i class="bi bi-box"></i>
          </span>
          <span class="item-name">{{ item.name }}</span>
          <span class="item-position">{{ i + 1 }}</span>
          <i class="bi bi-chevron-right item-chevron" aria-hidden="true"></i>
        </button>
      }
    </div>
  } @else {
    <div class="empty-state">
      <i class="bi bi-inbox" aria-hidden="true"></i>
      <p>Žádné položky k zobrazení.</p>
    </div>
  }

  <footer class="dialog-footer">
    <button class="close-button" type="button" (click)="closeModal()">
      <i class="bi bi-x-lg" aria-hidden="true"></i> Zavřít
    </button>
  </footer>
</section>
