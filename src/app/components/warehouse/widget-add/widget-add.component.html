<div class="container">
    @if (!store.isSaving()) {
    <form novalidate>
        <div>
            <input type="text" class="form-control" [formField]="form.name" (blur)="form.name().markAsTouched()"
                (keydown.enter)="onSave($event)">
            @if (form.name().invalid() && form.name().dirty()) {
            <div class="error">
                @for (error of form.name().errors(); track error.kind) {
                <p>{{ error.message }}</p>
                }
            </div>
            }
        </div>
    </form>
    <button class="save-button" (click)="onSave()" [class.disabled]="form().invalid()" [disabled]="form().invalid()"><i
            class="bi bi-check-lg"></i></button>
    <button class="delete-button" (click)="onDelete()"><i class="bi bi-trash"></i></button>
    } @else {
    <div class="spinner">
        <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    }
</div>
