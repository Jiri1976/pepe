<div class="warehouse-unit-row" [class.today]="isToday(unit().date)">
  <div class="unit-date">{{ unit().date }}</div>
  <form class="unit-value-form">
    @if (isNotTomorrow(unit().date)) {
      <div class="unit-controls">
        <input
          class="amount-input"
          type="text"
          inputmode="numeric"
          [attr.aria-label]="'Množství k datu ' + unit().date"
          [formField]="form.amount"
          (keydown.enter)="onSave($event)"
        />
        <input
          class="difference-input"
          type="text"
          [attr.aria-label]="
            'Rozdíl oproti předchozímu záznamu k datu ' + unit().date
          "
          [value]="diffValue() === -999999 ? '' : diffValue()"
          readonly
          disabled
          [style]="backgroundStyles()"
        />
        @if (
          (isToday(unit().date) && user()?.role === "Master") ||
          user()?.role === "Admin"
        ) {
          <button
            class="save-button"
            type="button"
            [attr.aria-label]="'Uložit množství k datu ' + unit().date"
            (click)="onSave($event)"
            [disabled]="form().invalid()"
          >
            @if (
              warehouseStore.isSaving() &&
              unit().date === warehouseStore.selectedUnit()?.date
            ) {
              <span
                class="spinner-border"
                role="status"
                aria-label="Ukládání"
              ></span>
            } @else {
              <i class="bi bi-check2" aria-hidden="true"></i>
            }
          </button>
        }
      </div>
    }
  </form>
</div>
