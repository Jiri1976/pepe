<div class="line w-100 mt-1">
    <div class="column first">{{unit().date}}</div>
    <form>
        <div class="column second">
            @if (isNotTomorrow(unit().date)) {
            <input type="text" [formField]="form.amount" (keydown.enter)="onSave($event)" />
            <div class="buttons">
                @if ((isToday(unit().date) && user()!.role === 'Master') || user()!.role === 'Admin') {
                <button class="save-button" type="button" (click)="onSave($event)" [disabled]="form().invalid()">
                    @if (warehouseStore.isSaving() && unit().date === warehouseStore.selectedUnit()?.date) {
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    } @else {
                    <i class="bi bi-check-lg"></i>
                    }
                </button>
                }
            </div>
            }
        </div>
    </form>
</div>
