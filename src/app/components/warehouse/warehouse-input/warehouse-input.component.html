<div
  class="line w-100 mt-1 d-flex flex-row align-items-center justify-content-between"
>
  <div class="column first d-flex flex-column align-items-center">
    {{ unit().date }}
  </div>
  <form>
    <div
      class="column second justify-content-between d-flex flex-row align-items-center p-0"
    >
      @if (isNotTomorrow(unit().date)) {
        <input
          type="text"
          [formField]="form.amount"
          (keydown.enter)="onSave($event)"
        />

        <input
          type="text"
          class="count"
          [value]="diffValue()"
          readonly
          [style]="backgroundStyles()"
        />

        <div
          class="buttons d-flex flex-row align-items-center justify-content-end"
        >
          @if (
            (isToday(unit().date) && user()?.role === "Master") ||
            user()?.role === "Admin"
          ) {
            <button
              class="save-button d-flex flex-column align-items-center justify-content-center"
              type="button"
              (click)="onSave($event)"
              [disabled]="form().invalid()"
            >
              @if (
                warehouseStore.isSaving() &&
                unit().date === warehouseStore.selectedUnit()?.date
              ) {
                <div class="spinner-border" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              } @else {
                <i class="bi bi-pencil-square"></i>
              }
            </button>
          }
        </div>
      }
    </div>
  </form>
</div>
