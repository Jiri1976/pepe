<section class="constraint-card">
  <header class="constraint-user-header">
    <span class="user-avatar" aria-hidden="true">
      {{ user().name.charAt(0) }}{{ user().surname.charAt(0) }}
    </span>
    <div>
      <span class="eyebrow">Nastavení dostupnosti</span>
      <h4>{{ user().name }} {{ user().surname }}</h4>
    </div>
    <span class="position-badge">{{ position() }}</span>
  </header>

  <div class="constraint-settings">
    <div class="setting-row target-shifts">
      <label for="{{ 'number-' + user().id }}"
        >Počet směn <span>(max {{ daysInMonth(propStore.currentCard()!.monthYear) }})</span></label
      >
      <input
        type="text"
        inputmode="numeric"
        [id]="'number-' + user().id"
        (keydown)="onKeydown($event)"
        (input)="onTargetShiftsInput($event)"
        [class.invalid]="invalidCountOfDays()"
        [ngModel]="model().targetShifts"
      />
    </div>

    <div class="setting-row toggle-row">
      <label [class.disable]="morning" for="{{ 'morning-' + user().id }}">Pouze ranní směny</label>
      <p-checkbox
        [id]="'morning-' + user().id"
        [(ngModel)]="morning"
        [binary]="true"
        (onChange)="onlyMorning()"
      />
    </div>

    <div class="setting-row toggle-row">
      <label [class.disable]="afternoon" for="{{ 'afternoon-' + user().id }}">Pouze odpolední směny</label>
      <p-checkbox
        [id]="'afternoon-' + user().id"
        [(ngModel)]="afternoon"
        [binary]="true"
        (onChange)="onlyAfternoon()"
      />
    </div>

    <div class="weekdays-panel">
      <div class="weekdays-heading">
        <div>
          <h5>Dostupné dny</h5>
          <span>Vyberte dny, kdy může pracovat</span>
        </div>
        <label class="whole-week-option" for="{{ 'whole-week-' + user().id }}">
          <p-checkbox
            [id]="'whole-week-' + user().id"
            [(ngModel)]="wholeWeek"
            [binary]="true"
            (onChange)="wholeWeekAvailable()"
          />
          Celý týden
        </label>
      </div>
      <p-selectbutton
        [options]="weekDays"
        [(ngModel)]="value"
        [multiple]="true"
        optionLabel="name"
        optionValue="value"
        [id]="'buttons-' + user().id"
        (onChange)="onSelectDay($event)"
      />
    </div>
  </div>

  <section class="calendar-scroll-section" aria-label="Výběr dostupnosti podle data">
    <div class="horizontal-scroll-wrapper">
      <div class="horizontal-scroll">
    <div class="calendar-option">
      <label for="{{ 'datepicker-' + user().id }}">Volno</label>
      <p-datepicker
        [defaultDate]="getDateFromMonthYear(propStore.currentCard()!.monthYear)"
        class="constraints-days-only mt-1"
        [ngModel]="dates()"
        [minDate]="minDate"
        (ngModelChange)="onFreeDaysChange($event)"
        selectionMode="multiple"
        [readonlyInput]="true"
        [inline]="true"
        [id]="'datepicker-' + user().id"
        (onSelect)="selectFreeDay($event)"
      />
    </div>

    <div class="calendar-option">
      <label
        [class.disabled]="morning"
        for="{{ 'morning-datepicker-' + user().id }}"
        >Ranní</label
      >
      <p-datepicker
        [defaultDate]="getDateFromMonthYear(propStore.currentCard()!.monthYear)"
        [minDate]="minDate"
        class="constraints-days-only mt-1"
        [ngModel]="morningDates()"
        (ngModelChange)="onMorningDaysChange($event)"
        selectionMode="multiple"
        [readonlyInput]="true"
        [inline]="true"
        [id]="'morning-datepicker-' + user().id"
        (onSelect)="selectMorningDay($event)"
        [disabled]="morning"
      />
    </div>

    <div class="calendar-option">
      <label
        [class.disabled]="afternoon"
        for="{{ 'afternoon-datepicker-' + user().id }}"
        >Odpolední</label
      >
      <p-datepicker
        [defaultDate]="getDateFromMonthYear(propStore.currentCard()!.monthYear)"
        [minDate]="minDate"
        class="constraints-days-only mt-1"
        [ngModel]="afternoonDates()"
        (ngModelChange)="onAfternoonDaysChange($event)"
        selectionMode="multiple"
        [readonlyInput]="true"
        [inline]="true"
        [id]="'afternoon-datepicker-' + user().id"
        (onSelect)="selectAfternoonDay($event)"
        [disabled]="afternoon"
      />
    </div>

    <div class="calendar-option">
      <label for="{{ 'datepicker-' + user().id }}">Celý den</label>
      <p-datepicker
        [defaultDate]="getDateFromMonthYear(propStore.currentCard()!.monthYear)"
        class="constraints-days-only mt-1"
        [ngModel]="wholeDayDates()"
        [minDate]="minDate"
        (ngModelChange)="onWholeDayDaysChange($event)"
        selectionMode="multiple"
        [readonlyInput]="true"
        [inline]="true"
        [id]="'datepicker-' + user().id"
        (onSelect)="selectWholeDay($event)"
      />
    </div>

    <div class="calendar-option">
      <label for="{{ 'opposite-datepicker-' + user().id }}">{{
        destination() === "F-M" ? "OVA" : "F-M"
      }}</label>
      <p-datepicker
        [defaultDate]="getDateFromMonthYear(propStore.currentCard()!.monthYear)"
        [minDate]="minDate"
        class="constraints-days-only mt-1 opposite-datepicker"
        [ngModel]="oppositeDates()"
        (ngModelChange)="onOppositeDaysChange($event)"
        selectionMode="multiple"
        [readonlyInput]="true"
        [inline]="true"
        [id]="'opposite-datepicker-' + user().id"
        disabled="true"
        /* (onSelect)="onSelectOppositeDaysChange($event)" */
      >
        <ng-template #date let-date let-selected="selected">
          <span
            class="opposite-date-cell"
            [class.opposite-date-cell-selected]="selected"
            [class.opposite-date-cell-whole]="
              selected && getOppositeShiftType(date) === 'whole'
            "
            [class.opposite-date-cell-morning]="
              selected && getOppositeShiftType(date) === 'morning'
            "
            [class.opposite-date-cell-afternoon]="
              selected && getOppositeShiftType(date) === 'afternoon'
            "
            [class.opposite-date-cell-other]="
              selected && getOppositeShiftType(date) === 'other'
            "
          >
            {{ date.day }}
          </span>
        </ng-template>
      </p-datepicker>
    </div>
    </div>
    </div>
  </section>
</section>
