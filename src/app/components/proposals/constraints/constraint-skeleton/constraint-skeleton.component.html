<section class="constraint-card" aria-hidden="true">
  <header class="constraint-user-header">
    <span class="skeleton avatar"></span>
    <div class="user-copy">
      <span class="skeleton eyebrow"></span>
      <span class="skeleton user-name"></span>
    </div>
    <span class="skeleton position-badge"></span>
  </header>

  <div class="constraint-settings">
    <div class="setting-row">
      <span class="skeleton setting-label"></span>
      <span class="skeleton count-input"></span>
    </div>
    <div class="setting-row">
      <span class="skeleton setting-label"></span>
      <span class="skeleton checkbox"></span>
    </div>
    <div class="setting-row">
      <span class="skeleton setting-label"></span>
      <span class="skeleton checkbox"></span>
    </div>

    <div class="weekdays-panel">
      <div class="weekdays-heading">
        <div>
          <span class="skeleton weekday-title"></span>
          <span class="skeleton weekday-hint"></span>
        </div>
        <span class="skeleton whole-week"></span>
      </div>
      <div class="weekday-options">
        @for (day of weekDays; track day) {
          <span class="skeleton weekday-button"></span>
        }
      </div>
    </div>
  </div>

  <section class="calendar-scroll-section" aria-label="Načítání kalendářů">
    <div class="horizontal-scroll-wrapper">
      <div class="horizontal-scroll">
        @for (calendar of calendars; track calendar) {
          <div class="calendar-option">
            <span class="skeleton calendar-label"></span>
            <div class="calendar-placeholder">
              <div class="calendar-weekdays">
                @for (day of weekDays; track day) {
                  <span class="skeleton calendar-day-label"></span>
                }
              </div>
              @for (row of calendarRows; track row) {
                <div class="calendar-week">
                  @for (day of weekDays; track day) {
                    <span class="skeleton calendar-day"></span>
                  }
                </div>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </section>
</section>
