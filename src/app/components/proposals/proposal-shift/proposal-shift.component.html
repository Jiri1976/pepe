<div>
    @switch (shiftType) {
    @case ('whole') {
    <div class="shift whole">X</div>
    }
    @case ('destination') {
    <div class="shift dest">{{ shift().from }}</div>
    }
    @case ('morning') {
    <div class="shift morning">
        <div class="upper">11</div>
        <div class="lower">17</div>
    </div>
    }
    @case ('afternoon') {
    <div class="shift afternoon">
        <div class="upper">17</div>
        <div class="lower">{{ shift().to!.substring(0,2) }}</div>
    </div>
    }
    @case ('custom') {
    <div class="shift custom">
        <div class="upper">{{ shift().from }}</div>
        <div class="lower">{{ shift().to }}</div>
    </div>
    }
    }
</div>
