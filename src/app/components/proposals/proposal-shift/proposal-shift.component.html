@switch (shiftType) {
  @case ('whole') {
    <div class="shift whole" aria-label="Celá směna">X</div>
  }
  @case ('destination') {
    <div class="shift dest" [attr.aria-label]="'Pobočka ' + shift().from">
      {{ shift().from }}
    </div>
  }
  @case ('morning') {
    <div class="shift morning" aria-label="Ranní směna">
      <span class="upper">11</span>
      <span class="lower">17</span>
    </div>
  }
  @case ('afternoon') {
    <div class="shift afternoon" aria-label="Odpolední směna">
      <span class="upper">17</span>
      <span class="lower">{{ shift().to!.substring(0, 2) }}</span>
    </div>
  }
  @case ('custom') {
    <div class="shift custom" [attr.aria-label]="shift().from + ' až ' + shift().to">
      <span class="upper">{{ shift().from }}</span>
      <span class="lower">{{ shift().to }}</span>
    </div>
  }
}
