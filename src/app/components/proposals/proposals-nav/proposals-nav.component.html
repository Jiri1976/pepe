<div class="menu">
    <ul>
        <li hide class="first" (click)="plansComponent.toggleCalendar()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-calendar"></i>
            </a>
        </li>

        <li hide (click)="plansComponent.onChangeDestination('F-M')">
            <a [style.--background]="destination() === 'F-M' ? '#24355A' : '#0EA5E9'" [style.--color]="'#fff'">
                <p>F-M</p>
            </a>
        </li>

        <li hide (click)="plansComponent.onChangeDestination('OVA')">
            <a [style.--background]="destination() === 'OVA' ? '#24355A' : '#0EA5E9'" [style.--color]="'#fff'">
                <p>OVA</p>
            </a>
        </li>

        <li hide (click)="plansComponent.onReset()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-arrow-clockwise"></i>
            </a>
        </li>

        <li hide (click)="plansComponent.onOpenPDF()" [class.disabled]="plansComponent.planCard()?.users?.length === 0">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                @if (!pdfLoading()) {
                <i class="bi bi-filetype-pdf"></i>
                } @else {
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                }
            </a>
        </li>

        <li hide (click)="plansComponent.onDelete()" [class.disabled]="plansComponent.planCard()?.users?.length === 0">
            <a [style.--background]="'#EF4444'" [style.--color]="'#fff'">
                <i class="bi bi-trash"></i>
            </a>
        </li>

        <li hide (click)="plansComponent.onSave()" [class.disabled]="plansComponent.nothingChanched()">
            <a [style.--background]="'#05C46B'" [style.--color]="'#fff'">
                @if (!isSaving()) {
                <i class="bi bi-floppy"></i>
                } @else {
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                }
            </a>
        </li>

        <li hideAdmin (click)="plansComponent.onReset()">
            <a [style.--background]="'#24355A'" [style.--color]="'#fff'">
                <i class="bi bi-arrow-clockwise"></i>
            </a>
        </li>

        <li hideAdmin (click)="plansComponent.onSave()" [class.disabled]="plansComponent.nothingChanched()">
            <a [style.--background]="'#05C46B'" [style.--color]="'#fff'">
                <i class="bi bi-floppy"></i>
            </a>
        </li>
    </ul>
</div>
